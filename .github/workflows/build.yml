name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Stockfish (official) কে Android arm64 এর জন্য কম্পাইল করে APK তে বসানো হয়।
      # এই স্টেপ ব্যর্থ হলেও APK বিল্ড চলবে (তখন ইনবিল্ট ইঞ্জিন ব্যবহার হবে)।
      - name: Build Stockfish for Android (arm64)
        id: sf
        continue-on-error: true
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}}"
          echo "NDK=$NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          LATEST=$(git ls-remote --tags --refs https://github.com/official-stockfish/Stockfish.git 'sf_*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          echo "Latest Stockfish tag: $LATEST"
          build_sf() {
            rm -rf Stockfish
            git clone --depth 1 --branch "$1" https://github.com/official-stockfish/Stockfish.git || return 1
            (cd Stockfish/src && make -j4 build ARCH=armv8 COMP=ndk) || return 1
            [ -f Stockfish/src/stockfish ] || return 1
          }
          if ! build_sf "$LATEST"; then
            echo "Latest failed, trying sf_17.1"
            build_sf sf_17.1
          fi
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp Stockfish/src/stockfish app/src/main/jniLibs/arm64-v8a/libstockfish.so
          ls -la app/src/main/jniLibs/arm64-v8a

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Arafat-Chess-Master.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Arafat-Chess-Master-APK
          path: Arafat-Chess-Master.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Arafat-Chess-Master.apk
