name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # প্রতি সোমবার: নতুন Stockfish এলে নতুন রিলিজ বানাবে

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest Stockfish
        id: chk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(git ls-remote --tags --refs https://github.com/official-stockfish/Stockfish.git 'sf_*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          echo "Latest Stockfish tag: $LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            BODY=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.body' 2>/dev/null || echo "")
            if echo "$BODY" | grep -q "Latest Stockfish tag seen: $LATEST"; then SKIP=true; fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.chk.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      # Stockfish কে Android arm64 এর জন্য কম্পাইল করে APK তে বসানো হয়।
      # সর্বশেষ ভার্সন ব্যর্থ হলে আগের ভার্সন চেষ্টা করে (সর্বোচ্চ ৪টি)।
      - name: Build Stockfish for Android (arm64)
        id: sfbuild
        if: steps.chk.outputs.skip != 'true'
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}}"
          echo "NDK=$NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          LIBDIR="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$LIBDIR"

          build_one() {
            T="$1"
            rm -rf Stockfish
            git clone --depth 1 --branch "$T" https://github.com/official-stockfish/Stockfish.git || return 1
            ( cd Stockfish/src && make net && make -j4 build ARCH=armv8 COMP=ndk ) > "$GITHUB_WORKSPACE/sf-$T.log" 2>&1 || return 1
            [ -f Stockfish/src/stockfish ] || return 1
            cp Stockfish/src/stockfish "$LIBDIR/libstockfish.so"
            # নতুন ফোনের জন্য দ্রুততর dotprod সংস্করণ (ব্যর্থ হলেও সমস্যা নেই)
            ( cd Stockfish/src && make clean && make net && make -j4 build ARCH=armv8-dotprod COMP=ndk ) >> "$GITHUB_WORKSPACE/sf-$T.log" 2>&1 \
              && [ -f Stockfish/src/stockfish ] && cp Stockfish/src/stockfish "$LIBDIR/libstockfish_dp.so"
            return 0
          }

          BUILT=""
          for T in $(git ls-remote --tags --refs https://github.com/official-stockfish/Stockfish.git 'sf_*' | sed 's#.*refs/tags/##' | sort -V | tail -4 | tac); do
            echo "=== Trying $T ==="
            rm -f "$LIBDIR"/*.so
            if build_one "$T"; then BUILT="$T"; break; fi
            echo "Build of $T failed (see sf-$T.log artifact)"
          done

          if [ -z "$BUILT" ]; then
            echo "No Stockfish build succeeded"
            exit 1
          fi
          command -v llvm-strip >/dev/null 2>&1 && llvm-strip "$LIBDIR"/*.so || true
          echo "built=$BUILT" >> "$GITHUB_OUTPUT"
          ls -la "$LIBDIR"

      - name: Upload Stockfish build logs
        if: always() && steps.chk.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stockfish-build-logs
          path: sf-*.log
          if-no-files-found: ignore

      - name: Prepare signing key
        if: steps.chk.outputs.skip != 'true'
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$KS_ALIAS"
              echo "KEY_PASSWORD=$KS_PASS"
            } >> "$GITHUB_ENV"
            echo "Signing with release key"
          else
            echo "No signing secrets - using debug key"
          fi

      - uses: gradle/actions/setup-gradle@v4
        if: steps.chk.outputs.skip != 'true'
        with:
          gradle-version: 8.7

      - name: Build APK
        if: steps.chk.outputs.skip != 'true'
        run: gradle assembleDebug -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      - name: Rename APK
        if: steps.chk.outputs.skip != 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk Arafat-Chess-Master.apk

      - uses: actions/upload-artifact@v4
        if: steps.chk.outputs.skip != 'true'
        with:
          name: Arafat-Chess-Master-APK
          path: Arafat-Chess-Master.apk

      - name: Publish release
        if: steps.chk.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: Arafat Chess Master v2.${{ github.run_number }}
          body: |
            Stockfish: ${{ steps.sfbuild.outputs.built }}
            Latest Stockfish tag seen: ${{ steps.chk.outputs.latest }}
          files: Arafat-Chess-Master.apk
